<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe | VÉLOUR</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="/components/tokens.css"><link rel="stylesheet" href="/components/buttons.css"><link rel="stylesheet" href="/components/fields.css"><link rel="stylesheet" href="/components/layout.css"></head><body><header><a class="logo" href="/">VÉLOUR <small>PRIVATE MOTORS</small></a><nav><a href="/">Ver site</a><button class="vl-btn vl-btn--secondary" id="logout" hidden>Sair</button></nav></header><main><section id="loginSection" class="panel narrow"><p class="eyebrow">ÁREA RESTRITA</p><h1>Entrar na equipe</h1><p>Use as credenciais administrativas configuradas no servidor.</p><form id="loginForm"><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="vl-btn vl-btn--primary">Entrar</button></form></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">GESTÃO DE CATÁLOGO</p><h1>Painel administrativo</h1></div><button class="vl-btn vl-btn--primary" id="newVehicle">+ Adicionar veículo</button></div><div class="tabs" role="tablist"><button data-tab="vehicles" class="selected">Veículos</button><button data-tab="leads">Interesses e visitas</button><button data-tab="proposals">Propostas de venda</button></div><div id="adminList"></div><section id="editor" class="panel" hidden><h2 id="editorTitle">Cadastrar veículo</h2><form id="vehicleForm" class="form-grid"><input name="id" type="hidden"><label>Marca<input name="brand" required maxlength="80"></label><label>Modelo<input name="model" required maxlength="100"></label><label>Ano<input name="year" required type="number" min="1950" max="2030"></label><label>Quilometragem<input name="km" required type="number" min="0"></label><label>Preço (R$)<input name="price" required type="number" min="1000" step="1"></label><label>Categoria<select name="category"><option>Esportivo</option><option>SUV</option><option>Sedã</option><option>Conversível</option></select></label><label>Combustível<input name="fuel" required></label><label>Transmissão<input name="transmission" required></label><label>Cor<input name="color" required></label><label>Potência<input name="power" required></label><label>Destaque/tag<input name="tag" required></label><label>Status<select name="status"><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option><option value="rascunho">Rascunho</option></select></label><label class="full">URL HTTPS da imagem<input name="image" type="url" required pattern="https://.*"></label><label class="full">Descrição<textarea name="description" rows="5" required maxlength="3000"></textarea></label><div class="full actions"><button class="vl-btn vl-btn--primary" type="submit">Salvar veículo</button><button id="cancelEdit" type="button" class="vl-btn vl-btn--secondary secondary">Cancelar</button></div></form></section></section><p id="message" role="status" aria-live="polite"></p></main><script src="admin.js" defer></script></body></html>
